name: Publicar CODE QUEST 4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v4
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verificar los recursos públicos de la aplicación
        run: |
          base64 --decode CODE_QUEST_v4_Publicar.zip.b64 > "$RUNNER_TEMP/codequest-v4-web.zip"
          echo "746d8e09e5217af0cd41b7441467d1bc46f509fcc8d1dcabac92c8c59e87e573  $RUNNER_TEMP/codequest-v4-web.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/codequest-v4-web.zip" -d public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
