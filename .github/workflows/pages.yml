name: Publicar CODE QUEST 4
on:
  push:
    branches: [main]
    # El paquete se sube primero; la publicación empieza al actualizar su SHA-256.
    # Los cambios de documentación y capturas no necesitan desplegar la app.
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v4
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verificar los recursos públicos de la aplicación
        run: |
          base64 --decode CODE_QUEST_v4_Publicar.zip.b64 > "$RUNNER_TEMP/codequest-v4-web.zip"
          echo "ddf8a4caa2f45ec0a84305c3f709eab294abd642887e1d31a916c22858d439b8  $RUNNER_TEMP/codequest-v4-web.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/codequest-v4-web.zip" -d public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
